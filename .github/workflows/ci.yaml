name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: test -z "$(gofmt -l api cmd internal test)"
      - run: make verify
      - run: make envtest test-integration
      - run: docker build -t preview-operator:dev .
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: make envtest
      - run: KUBECTL="$(./bin/setup-envtest use 1.37.0 --bin-dir "$PWD/.envtest" -p path)/kubectl" make test-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: docs/verification/e2e-*
